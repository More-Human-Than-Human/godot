[package]
name = "godot_mcp"
version = "0.2.0"
edition = "2021"
description = "Unified MCP server for Godot: LSP, project introspection, validation, headless runner, editor bridge"

[[bin]]
name = "godot_mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
rmcp = { version = "2.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
